spring:
  application:
    name: xu-ai-agent
    # application.yml
  profiles:
    active: dev
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
  datasource:
    url: jdbc:postgresql://pgm-uf6uo4af1355uviq9o.rwlb.rds.aliyuncs.com:5432/xu-ai-agent
    username: xucheng
    password: Xu577525866
    vectorstore:
      pgvector:
        index-type: hnsw
        dimensions: 1536
        distance-type: cosine_distance
        max-document-batch-size: 10000
server:
  servlet:
    context-path: /api
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match[0]: '/**'
      packages-to-scan[0]: com.xucheng.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn